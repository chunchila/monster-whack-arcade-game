<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>ציד המפלצות - ארקייד</title><style>*{margin:0;box-sizing:border-box}body{background:#0d0221;color:#fff;font-family:"Arial Black",Impact,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;touch-action:manipulation;user-select:none}h1{margin:10px;font-size:22px;color:#ff2a6d;text-shadow:0 0 10px #ff2a6d,0 0 20px #05d9e8}#hud{display:flex;gap:16px;font-size:18px;color:#05d9e8;margin:6px}#g{display:grid;grid-template-columns:repeat(3,96px);gap:12px;margin:14px}.h{width:96px;height:96px;border-radius:50%;background:radial-gradient(#000,#1a0b3d);border:3px solid #05d9e8;box-shadow:0 0 14px #05d9e8,inset 0 0 14px #000;display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden;cursor:pointer}.m{animation:p .15s}@keyframes p{from{transform:translateY(60px) scale(.5)}to{transform:none}}button{background:#ff2a6d;color:#fff;border:0;border-radius:8px;padding:12px 26px;font-size:18px;font-family:inherit;box-shadow:0 0 14px #ff2a6d;margin:8px}</style></head><body><h1>👹 ציד המפלצות</h1><div id="hud"><span>ניקוד <b id="s">0</b></span><span>זמן <b id="tm">30</b></span><span>שיא <b id="b">0</b></span></div><div id="g"></div><p style="opacity:.7;font-size:13px;font-family:Arial">הכו במפלצות · אל תיגעו ב־🧑‍🍳 החף מפשע!</p><button id="r">התחל</button>
<script>
let sc,tl,run,cell=[],tick,spawn,best=+localStorage.monBest||0;b.textContent=best;
for(let i=0;i<9;i++){const d=document.createElement('div');d.className='h';d.onpointerdown=()=>hit(i);g.appendChild(d);cell.push({d,v:null})}
const M=['👹','👻','🤖','👽','🦖'];
function start(){sc=0;tl=30;run=true;s.textContent=0;tm.textContent=30;cell.forEach(c=>{c.v=null;c.d.textContent=''});clearInterval(tick);clearTimeout(spawn);tick=setInterval(()=>{tl--;tm.textContent=tl;if(tl<=0)end()},1000);pop()}
function pop(){if(!run)return;const free=cell.filter(c=>!c.v);if(free.length){const c=free[Math.random()*free.length|0];const bad=Math.random()<.18;c.v=bad?'🧑‍🍳':M[Math.random()*M.length|0];c.d.textContent=c.v;c.d.classList.remove('m');void c.d.offsetWidth;c.d.classList.add('m');setTimeout(()=>{if(c.v){c.v=null;c.d.textContent=''}},Math.max(500,1000-sc*6))}
 spawn=setTimeout(pop,Math.max(260,650-sc*4))}
function hit(i){if(!run)return;const c=cell[i];if(!c.v)return;sc+=c.v=='🧑‍🍳'?-15:10;if(sc<0)sc=0;s.textContent=sc;c.v=null;c.d.textContent='💥';setTimeout(()=>{if(!c.v)c.d.textContent=''},150)}
function end(){run=false;clearInterval(tick);clearTimeout(spawn);cell.forEach(c=>{c.v=null;c.d.textContent=''});if(sc>best){best=sc;localStorage.monBest=best;b.textContent=best}setTimeout(()=>alert('⏱️ נגמר הזמן! ניקוד: '+sc),50)}
r.onclick=start;
</script></body></html>
