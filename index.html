<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>ציד המפלצות - ארקייד</title><style>*{margin:0;box-sizing:border-box}body{background:#0d0221;color:#fff;font-family:"Arial Black",Impact,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;touch-action:manipulation;user-select:none}h1{margin:10px;font-size:22px;color:#ff2a6d;text-shadow:0 0 10px #ff2a6d,0 0 20px #05d9e8}#hud{display:flex;gap:16px;font-size:18px;color:#05d9e8;margin:6px}#g{display:grid;grid-template-columns:repeat(3,96px);gap:12px;margin:14px}.h{width:96px;height:96px;border-radius:50%;background:radial-gradient(#000,#1a0b3d);border:3px solid #05d9e8;box-shadow:0 0 14px #05d9e8,inset 0 0 14px #000;display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden;cursor:pointer}.m{animation:p .15s}@keyframes p{from{transform:translateY(60px) scale(.5)}to{transform:none}}button{background:#ff2a6d;color:#fff;border:0;border-radius:8px;padding:12px 26px;font-size:18px;font-family:inherit;box-shadow:0 0 14px #ff2a6d;margin:8px}</style></head><body><h1>ציד המפלצות</h1><div id="hud"><span>ניקוד <b id="s">0</b></span><span>זמן <b id="tm">30</b></span><span>שיא <b id="b">0</b></span></div><div id="g"></div><p style="opacity:.7;font-size:13px;font-family:Arial">הכו במפלצות · אל תיגעו בטבח התמים!</p><button id="r">התחל</button>
<script>
let sc,tl,run,cell=[],tick,spawn,best=+localStorage.monBest||0;b.textContent=best;
for(let i=0;i<9;i++){const d=document.createElement('div');d.className='h';d.onpointerdown=()=>hit(i);g.appendChild(d);cell.push({d,v:null})}
const W=(b)=>'<svg viewBox="0 0 64 64" width="70" height="70">'+b+'</svg>';
const MS=[
W('<path d="M12 22l8-14 6 12M52 22l-8-14-6 12" fill="#ffd447"/><circle cx="32" cy="36" r="22" fill="#e8352e"/><circle cx="23" cy="32" r="6" fill="#fff"/><circle cx="41" cy="32" r="6" fill="#fff"/><circle cx="24" cy="33" r="3" fill="#111"/><circle cx="40" cy="33" r="3" fill="#111"/><path d="M20 26l8 3M44 26l-8 3" stroke="#111" stroke-width="3"/><path d="M20 44q12 10 24 0z" fill="#111"/><path d="M24 44v4M32 45v5M40 44v4" stroke="#fff" stroke-width="3"/>'),
W('<path d="M10 56V30a22 22 0 0 1 44 0v26l-7-6-7 6-8-6-8 6-7-6z" fill="#f4f6ff" stroke="#8a93c9" stroke-width="2"/><circle cx="24" cy="30" r="5" fill="#222"/><circle cx="40" cy="30" r="5" fill="#222"/><ellipse cx="32" cy="42" rx="5" ry="7" fill="#222"/><circle cx="14" cy="38" r="4" fill="#ffb3c7" opacity=".7"/><circle cx="50" cy="38" r="4" fill="#ffb3c7" opacity=".7"/>'),
W('<line x1="32" y1="4" x2="32" y2="14" stroke="#9aa0b8" stroke-width="3"/><circle cx="32" cy="5" r="4" fill="#ff4d6d"/><rect x="10" y="14" width="44" height="36" rx="8" fill="#a9b4cf" stroke="#5a6488" stroke-width="2"/><rect x="16" y="22" width="14" height="12" rx="3" fill="#1c2340"/><rect x="34" y="22" width="14" height="12" rx="3" fill="#1c2340"/><circle cx="23" cy="28" r="4" fill="#35d0ff"/><circle cx="41" cy="28" r="4" fill="#35d0ff"/><rect x="18" y="40" width="28" height="6" fill="#1c2340"/><path d="M24 40v6M32 40v6M40 40v6" stroke="#a9b4cf" stroke-width="2"/><rect x="4" y="26" width="6" height="12" fill="#5a6488"/><rect x="54" y="26" width="6" height="12" fill="#5a6488"/>'),
W('<line x1="22" y1="8" x2="26" y2="18" stroke="#3ddc84" stroke-width="3"/><line x1="42" y1="8" x2="38" y2="18" stroke="#3ddc84" stroke-width="3"/><circle cx="22" cy="7" r="4" fill="#ff4d6d"/><circle cx="42" cy="7" r="4" fill="#ff4d6d"/><ellipse cx="32" cy="36" rx="22" ry="24" fill="#3ddc84"/><ellipse cx="22" cy="34" rx="8" ry="11" fill="#111" transform="rotate(-20 22 34)"/><ellipse cx="42" cy="34" rx="8" ry="11" fill="#111" transform="rotate(20 42 34)"/><circle cx="20" cy="30" r="2.5" fill="#fff"/><circle cx="40" cy="30" r="2.5" fill="#fff"/><path d="M26 50q6 4 12 0" stroke="#111" stroke-width="3" fill="none"/>'),
W('<circle cx="32" cy="36" r="24" fill="#7b61ff"/><path d="M10 28l6 3-3 5zM54 28l-6 3 3 5zM22 14l3 6-6 1zM42 14l-3 6 6 1z" fill="#5b3fd6"/><circle cx="32" cy="32" r="13" fill="#fff"/><circle cx="32" cy="33" r="7" fill="#ff9f1a"/><circle cx="32" cy="33" r="3.5" fill="#111"/><path d="M18 50q14 10 28 0" stroke="#111" stroke-width="3" fill="none"/><path d="M24 52v4M32 54v4M40 52v4" stroke="#fff" stroke-width="3"/>')];
const CHEF=W('<path d="M14 24a8 8 0 0 1 4-14 10 10 0 0 1 14-3 10 10 0 0 1 14 3 8 8 0 0 1 4 14z" fill="#fff" stroke="#c9c9d6" stroke-width="2"/><rect x="14" y="22" width="36" height="8" fill="#fff" stroke="#c9c9d6" stroke-width="2"/><circle cx="32" cy="42" r="16" fill="#ffd2a8"/><circle cx="26" cy="40" r="2.5" fill="#222"/><circle cx="38" cy="40" r="2.5" fill="#222"/><path d="M20 46q6-4 12 0 6-4 12 0-6 6-12 2-6 4-12-2z" fill="#5a3a1a"/><path d="M28 52q4 3 8 0" stroke="#a24" stroke-width="2" fill="none"/>');
const M=[0,1,2,3,4];const SV=v=>v==='chef'?CHEF:MS[v];
function start(){sc=0;tl=30;run=true;s.textContent=0;tm.textContent=30;cell.forEach(c=>{c.v=null;c.d.innerHTML=''});clearInterval(tick);clearTimeout(spawn);tick=setInterval(()=>{tl--;tm.textContent=tl;if(tl<=0)end()},1000);pop()}
function pop(){if(!run)return;const free=cell.filter(c=>c.v===null);if(free.length){const c=free[Math.random()*free.length|0];const bad=Math.random()<.18;c.v=bad?'chef':M[Math.random()*M.length|0];c.d.innerHTML=SV(c.v);c.d.classList.remove('m');void c.d.offsetWidth;c.d.classList.add('m');setTimeout(()=>{if(c.v!==null){c.v=null;c.d.innerHTML=''}},Math.max(500,1000-sc*6))}
 spawn=setTimeout(pop,Math.max(260,650-sc*4))}
function hit(i){if(!run)return;const c=cell[i];if(c.v===null)return;sc+=c.v==='chef'?-15:10;if(sc<0)sc=0;s.textContent=sc;c.v=null;c.d.innerHTML='<svg viewBox="0 0 64 64" width="70" height="70"><polygon points="32,4 38,22 58,16 44,32 60,46 40,44 32,60 26,42 6,48 20,32 8,16 28,22" fill="#ffd447" stroke="#ff2a6d" stroke-width="3"/></svg>';setTimeout(()=>{if(c.v===null)c.d.innerHTML=''},150)}
function end(){run=false;clearInterval(tick);clearTimeout(spawn);cell.forEach(c=>{c.v=null;c.d.innerHTML=''});if(sc>best){best=sc;localStorage.monBest=best;b.textContent=best}setTimeout(()=>alert('⏱️ נגמר הזמן! ניקוד: '+sc),50)}
r.onclick=start;
</script></body></html>
